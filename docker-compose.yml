services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-vertice}
      POSTGRES_USER: ${DB_USERNAME:-vertice}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vertice}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vertice} -d ${DB_NAME:-vertice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../vertice-api
      target: dev
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-vertice}
      DB_USERNAME: ${DB_USERNAME:-vertice}
      DB_PASSWORD: ${DB_PASSWORD:-vertice}
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ../vertice-api:/app
      - api_gradle_cache:/root/.gradle
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  bff:
    build:
      context: ../vertice-bff
      target: dev
    init: true
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${BFF_LOG_LEVEL:-info}
      CORS_ORIGIN: http://localhost:5173
      VERTICE_API_GRPC_HOST: api
      VERTICE_API_GRPC_PORT: 9090
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    ports:
      - "3000:3000"
    volumes:
      - ../vertice-bff:/app
      - bff_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_gradle_cache:
  bff_node_modules:
